syntax = "proto3";

package connector;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/arangodb/kube-arangodb/integrations/link/v1/definition";

// Job state. Modelled on the ArangoDB Agency supervision job lifecycle
// (ToDo -> Pending -> Finished/Failed): a job is relocated between per-state
// buckets in the Meta Store as it progresses.
enum JobState {
  // Job submitted, queued and waiting to be picked up by a link
  JOB_STATE_TODO = 0;
  // Job picked up by a link handler and in progress
  JOB_STATE_PENDING = 1;
  // Execution finished successfully, results available in FileStore
  JOB_STATE_FINISHED = 2;
  // Execution failed. Description field describes the failure (includes timeout)
  JOB_STATE_FAILED = 3;
  // Cancelled from the ToDo or Pending state
  JOB_STATE_CANCELLED = 4;
}

// Job status
message JobStatus {
  // Current state
  JobState state = 1;
  // Human-readable description of the current status
  string description = 2;
  // Timestamp when status was last updated
  google.protobuf.Timestamp updated = 3;
}

// Job represents a unit of work submitted to a link
message Job {
  // Unique job identifier (UUID)
  string id = 1;
  // Link UUID that owns this job
  string link_id = 2;
  // Handler UUID that picked up this job (set when Scheduled)
  optional string handler_id = 3;
  // Status history (most recent first, max 10 entries). First element is the current status
  repeated JobStatus statuses = 4;
  // Input as JSON (validated against connector's JSON Schema)
  bytes input = 5;
  // Per-job timeout requested by the caller. If not set, no timeout
  optional google.protobuf.Duration timeout = 6;
  // Timestamp when job was created
  google.protobuf.Timestamp created = 7;
  // Result path in FileStore (set when job is Finished)
  // Path format: /links/<link_id>/<job_id>/
  optional string result = 8;
  // Scheduling priority. Higher values are picked up first; ties are broken
  // FIFO by creation time. Defaults to 0
  int32 priority = 9;
}

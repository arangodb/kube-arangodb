syntax = "proto3";

package envoy_config;

import "google/protobuf/any.proto";

import "integrations/shared/v1/definition/empty.proto";

option go_package = "github.com/arangodb/kube-arangodb/integrations/envoy/config/v1/definition";

// EnvoyConfigV1 is the operator control channel for push (ADS) mode. The operator pushes the rendered
// gateway dynamic config (CDS/LDS resources) at a given revision; the sidecar installs it as the ADS
// snapshot and serves it to Envoy. The Push RPC requires a superuser (server) identity.
service EnvoyConfigV1 {
  // Push installs the provided CDS/LDS resources as the current ADS snapshot at the given version.
  rpc Push(EnvoyConfigV1PushRequest) returns (EnvoyConfigV1PushResponse);

  // Status returns the version (revision) of the snapshot the sidecar is currently serving.
  rpc Status(shared.Empty) returns (EnvoyConfigV1StatusResponse);
}

// EnvoyConfigV1 Push Call Request
message EnvoyConfigV1PushRequest {
  // Version (revision) of the config, e.g. the config SHA computed by the operator
  string version = 1;

  // CDS resources (envoy.config.cluster.v3.Cluster)
  repeated google.protobuf.Any clusters = 2;

  // LDS resources (envoy.config.listener.v3.Listener)
  repeated google.protobuf.Any listeners = 3;
}

// EnvoyConfigV1 Push Call Response
message EnvoyConfigV1PushResponse {
  // Version (revision) now being served
  string version = 1;
}

// EnvoyConfigV1 Status Call Response
message EnvoyConfigV1StatusResponse {
  // Version (revision) currently being served, empty if only the initial snapshot is installed
  string version = 1;
}

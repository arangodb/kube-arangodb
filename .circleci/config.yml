# TEMP(arm64-migration): during the multi-arch (amd64+arm64) migration this
# pipeline is reduced to the per-architecture operator binary builds only.
# Everything else (the setup/path-filtering continuation and the check-code and
# CVE-scan jobs that used to live in .circleci/continue_config.yml) is commented
# out at the bottom of this file with the TEMP(arm64-migration) marker and must
# be restored before merge.
version: 2.1

executors:
  # Native-arch Go toolchain executors for the per-architecture operator binary
  # builds. These only compile the binary and hand it to the image jobs via the
  # workspace, so no Docker is required and they run on the non-privileged
  # self-hosted classes.
  golang-binary-amd64:
    docker:
      - image: 889010145541.dkr.ecr.us-east-1.amazonaws.com/cicd/golang:1.26.8
    resource_class: arangodb/large-amd64

  golang-binary-arm64:
    docker:
      - image: 889010145541.dkr.ecr.us-east-1.amazonaws.com/cicd/golang:1.26.8
    resource_class: arangodb/large-arm64

jobs:
  # Per-architecture operator binary builds. Each binary is compiled on its own
  # native-arch runner and persisted to the workspace; the image build and
  # multi-arch manifest jobs (added in a follow-up) attach the workspace so the
  # Dockerfile only has to ADD the prebuilt bin/linux/<arch>/arangodb_operator.
  build-binary-amd64:
    executor: golang-binary-amd64
    steps:
      - checkout
      - run:
          name: Build operator binary (linux/amd64)
          command: make operator-binary-linux-amd64
      - persist_to_workspace:
          root: .
          paths:
            - bin/linux/amd64/arangodb_operator

  build-binary-arm64:
    executor: golang-binary-arm64
    steps:
      - checkout
      - run:
          name: Build operator binary (linux/arm64)
          command: make operator-binary-linux-arm64
      - persist_to_workspace:
          root: .
          paths:
            - bin/linux/arm64/arangodb_operator

workflows:
  version: 2

  dev-images:
    jobs:
      - build-binary-amd64
      - build-binary-arm64


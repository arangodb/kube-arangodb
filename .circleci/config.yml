version: 2.1

# EXACT ORB VERSIONS ONLY, no @1 / @1.2 floats. CircleCI resolves a float at
# config-compile time, so a future orb publish silently changes what runs here
# with zero repo diff and zero review.
orbs:
  path-filtering: circleci/path-filtering@1.2.0
  continuation: circleci/continuation@2.0.1

setup: true

parameters:
  manifests-verify:
    type: boolean
    default: false
  # Selects the nightly security tier in .circleci/continue_config.yml. Set ONLY
  # by a CircleCI Scheduled Pipeline; false on every push and pull request, which
  # is what selects the always-run path below.
  #
  # WHY A PARAMETER AND NOT A `triggers: schedule`. Two reasons, both measured
  # rather than stylistic. A legacy scheduled workflow is read only from the
  # top-level config, which under `setup: true` is this file, so a `triggers:`
  # block in continue_config.yml validates and then never runs: the nightly would
  # look configured and produce nothing. And a legacy schedule sets no pipeline
  # parameters, so it cannot tell the two continuation paths below apart, and a
  # pipeline that reaches the continuation API twice fails. A Scheduled Pipeline
  # does set parameters, which is what makes exactly one of these two workflows
  # run in any pipeline.
  #
  # CREATING THE SCHEDULE IS AN OWNER ACTION, and until it is done the nightly
  # tier does not run. It is one API call, recorded in SECURITY.md under Known
  # gaps so it cannot be mistaken for coverage that already exists.
  nightly:
    type: boolean
    default: false

jobs:
  # Continue into continue_config.yml with nightly=true. path-filtering cannot do
  # this: it derives the continuation parameters from the files a revision range
  # changed and forwards nothing else, so a scheduled run would arrive with
  # nightly unset and take the pull-request path.
  nightly-continue:
    executor: continuation/default
    steps:
      - checkout
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          parameters: '{"nightly": true}'

workflows:
  # Exactly one of these two workflows runs in any pipeline, because the two
  # conditions are complements and each ends in a continuation. A pipeline that
  # calls the continuation API twice fails, so this is a correctness constraint
  # rather than a tidiness one.
  always-run:
    when:
      not: << pipeline.parameters.nightly >>
    jobs:
      - path-filtering/filter:
          name: check-updated-files
          base-revision: << pipeline.git.base_revision >>
          config-path: .circleci/continue_config.yml
          tag: "3.12"
          mapping: |
            manifests/.* manifests-verify true
            chart/.* manifests-verify true

  nightly-setup:
    when: << pipeline.parameters.nightly >>
    jobs:
      - nightly-continue

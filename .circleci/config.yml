version: 2.1

# Pin exact orb versions. A float resolves at compile time, so a later orb publish
# would change what runs here with no repo diff.
orbs:
  path-filtering: circleci/path-filtering@1.2.0
  continuation: circleci/continuation@2.0.1

setup: true

parameters:
  manifests-verify:
    type: boolean
    default: false
  # Set only by a CircleCI Scheduled Pipeline; false on push and PR, which selects
  # the always-run path below.
  # A legacy `triggers: schedule` cannot replace it: under setup:true it is read only
  # from this file, and it sets no pipeline parameters, so it could not select
  # between the two continuation paths (and a pipeline reaching the continuation API
  # twice fails).
  # Creating the schedule is an owner action; until then the nightly tier does not
  # run. Recorded under Known gaps in SECURITY.md.
  nightly:
    type: boolean
    default: false

jobs:
  # Scheduled runs need their own continuation: path-filtering derives its
  # parameters from changed files and forwards nothing else, so a nightly would
  # arrive with nothing set and take the pull-request path.
  nightly-continue:
    executor: continuation/default
    steps:
      - checkout
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          # No parameters here, deliberately. A parameter provided at trigger time is
          # forwarded to the continued config already, so passing it again answers
          # Conflicting pipeline parameters (job 6898); the continued config must still
          # declare it or compilation fails (pipeline 3564).

workflows:
  # The two conditions are complements: a pipeline that calls the continuation API
  # twice fails, so this is a correctness constraint.
  always-run:
    when:
      not: << pipeline.parameters.nightly >>
    jobs:
      - path-filtering/filter:
          name: check-updated-files
          base-revision: << pipeline.git.base_revision >>
          config-path: .circleci/continue_config.yml
          tag: "3.12"
          mapping: |
            manifests/.* manifests-verify true
            chart/.* manifests-verify true

  nightly-setup:
    when: << pipeline.parameters.nightly >>
    jobs:
      - nightly-continue

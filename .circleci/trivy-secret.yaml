# Trivy secret-scanner config, passed to secret-scan as `secret-config-path`.
# Trivy's built-in "tests" ALLOW rule hides any finding under test/, testdata/ or
# *_test.*, and every baked-credential incident in this fleet has lived exactly
# there, so it is disabled below.
# Doing so surfaces nine HIGH private-key findings in two committed agency dumps
# (pkg/deployment/agency/state/testdata/sync.{source,target}.json). They are left
# undispositioned on purpose: redact or rotate is the owning team's call, and an
# allow-rule added by anyone else would suppress a real key finding. secret-scan
# stays report-only until then.
# This file is safe to copy to another repo; allow-rules entries are not, since
# they are per-repo acceptances.
# review by: 2027-07-25
disable-allow-rules:
  # Excludes tests/, testdata/, *_test.* and test_*.* from secret detection.
  - tests
# Dated allow-rules for reviewed non-live fixtures go here. Each needs a
# `review by: YYYY-MM-DD`; disposition-check fails once a date passes. Shape:
#
# allow-rules:
#   # review by: a real YYYY-MM-DD date
#   - id: agency-state-fixture-key
#     description: non-live EC private key in a captured agency dump
#     path: pkg/deployment/agency/state/testdata/sync\..*\.json

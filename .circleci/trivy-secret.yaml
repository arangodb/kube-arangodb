# Trivy secret-scanner configuration for this repository.
# Passed to the secret-scan job as `secret-config-path`.
#
# WHY THIS FILE EXISTS
# Trivy ships built-in ALLOW rules, and one of them ("tests") suppresses every
# finding whose path looks like test code: test/, tests/, testdata/, test_*.*
# and *_test.go. Every baked-credential incident in this fleet has lived in
# exactly that tree, so leaving the secret layer blind to it is not a defensible
# default.
#
# WHAT DISABLING IT SURFACED HERE, measured on trivy v0.72.0 at this commit:
# nine HIGH `private-key` findings, all EC private keys inside two committed
# agency-state fixtures, pkg/deployment/agency/state/testdata/sync.source.json
# and sync.target.json. They are captured dumps of an arangosync deployment's
# agency, so the same key material appears three times per file (the agency
# view, the raft log entry that wrote it, and the compacted readDB). They are
# NOT dispositioned below, on purpose: what happens to them is the owning
# team's call, either redact the fixture or rotate the CA and record a dated
# acceptance. An allow-rule added here by anyone other than that owner would
# suppress a real key finding.
#
# GATE STATUS: secret-scan is REPORT-ONLY (fail-on-findings false, severity
# CRITICAL,HIGH,MEDIUM,LOW). The flip to blocking is one reviewed line in
# .circleci/continue_config.yml plus one line in .github/required-checks.txt,
# and it waits on those two fixtures rather than on a scanner change.
#
# FLEET TEMPLATE NOTE: disable-allow-rules below is generic and safe to copy.
# Any allow-rules entries would be repository-specific acceptances and MUST NOT
# be copied; a copied allow-rule silently suppresses a real credential in the
# copying repository.
#
# Re-review the decision to keep test code in secret scope on the annual
# control review. review by: 2027-07-25
disable-allow-rules:
  # Built-in allow rule that excludes tests/, test/, testdata/, *_test.* and
  # test_*.* from secret detection entirely.
  - tests
# Dated allow-rules for genuine, non-live fixtures go here once an owner has
# reviewed one. Each needs a `review by: YYYY-MM-DD` date, and the
# disposition-check job fails the build once a date passes. Shape:
#
# allow-rules:
#   # Non-live EC key in a captured agency-state fixture, rotated <date>.
#   # review by: <a real YYYY-MM-DD date>
#   - id: agency-state-fixture-key
#     description: non-live EC private key in a captured agency dump
#     path: pkg/deployment/agency/state/testdata/sync\..*\.json

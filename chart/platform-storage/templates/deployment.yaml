---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ template "platform-storage.releaseName" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ template "platform-storage.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ template "platform-storage.name" . }}
      app.kubernetes.io/managed-by: {{ .Release.Service }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ template "platform-storage.name" . }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        release: {{ .Release.Name }}
{{- $seaweedfs := eq .Values.backend "seaweedfs" }}
{{- $b := ternary .Values.seaweedfs .Values.minio $seaweedfs }}
    spec:
{{- if $b.nodeSelector }}
      nodeSelector:
{{ toYaml $b.nodeSelector | indent 8 }}
{{- end }}
{{- if $b.tolerations }}
      tolerations:
{{ toYaml $b.tolerations | indent 8 }}
{{- end }}
      containers:
{{- if $seaweedfs }}
        - name: seaweedfs
          image: "{{ .Values.seaweedfs.image }}"
          imagePullPolicy: {{ .Values.seaweedfs.imagePullPolicy }}
          # `weed server` runs master + volume + filer in one process; `-s3` adds the S3 gateway.
          command:
            - weed
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=1024
            - -volume.max=0
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - containerPort: 8333
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
{{- if .Values.seaweedfs.resources }}
          resources:
{{ toYaml .Values.seaweedfs.resources | indent 12 }}
{{- end }}
{{- else }}
        - name: minio
          image: "{{ .Values.minio.image }}"
          args:
            - server
            - /data
          envFrom:
            - secretRef:
                name: "{{ template "platform-storage.releaseName" . }}-root-credentials"
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
{{- if .Values.minio.resources }}
          resources:
{{ toYaml .Values.minio.resources | indent 12 }}
{{- end }}
{{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: "{{ template "platform-storage.releaseName" . }}"
{{- if $seaweedfs }}
        - name: s3-config
          secret:
            secretName: "{{ template "platform-storage.releaseName" . }}-config"
{{- end }}
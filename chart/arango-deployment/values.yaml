    upgradeMode: ""
    manualUpgradeMode: ""
    indexMethod: ""
    memoryReservation: 0
    overrideDetectedTotalMemory: false
    overrideDetectedNumberOfCores: false
    pvcResizeMode: ""
    sidecars: []

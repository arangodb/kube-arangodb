{{- if eq .Values.deployment.auth.mode "Generated" }}
{{- $name := printf "%s-jwt" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  # Reuse the existing token on upgrade so the JWT secret is not rotated; generate one on first install.
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}

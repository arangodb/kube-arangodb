{{- if eq .Values.deployment.tls.mode "Generated" }}
{{- $name := printf "%s-ca" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  # Reuse the existing CA on upgrade so it is not rotated; generate a self-signed CA on first install.
  {{- if $existing }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  ca.key: {{ index $existing.data "ca.key" }}
  {{- else }}
  {{- $ca := genCA (printf "%s CA" .Release.Name) 3650 }}
  ca.crt: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
  {{- end }}
{{- end }}

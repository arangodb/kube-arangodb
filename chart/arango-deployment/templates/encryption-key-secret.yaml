{{- if eq .Values.deployment.encryption.mode "Generated" }}
{{- $name := printf "%s-encryption" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  # The encryption key cannot change after the deployment is created; reuse the existing one on upgrade.
  key: {{ if $existing }}{{ index $existing.data "key" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}

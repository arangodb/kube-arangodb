{{- $l := .Values.deployment.license }}
{{- if and $l.secretName (or $l.value (and $l.clientID $l.clientSecret)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $l.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- if eq $l.version "v1" }}
  token: {{ $l.value | quote }}
  {{- else if eq $l.version "manager" }}
  license-client-id: {{ $l.clientID | quote }}
  license-client-secret: {{ $l.clientSecret | quote }}
  {{- else }}
  license-v2: {{ $l.value | quote }}
  {{- end }}
{{- end }}

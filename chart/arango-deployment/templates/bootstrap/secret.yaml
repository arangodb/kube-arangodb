{{- range $user := .Values.deployment.bootstrap.generatedPasswords }}
{{- $name := printf "%s-%s-password" $.Release.Name $user }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
type: Opaque
data:
  # Reuse the existing password on upgrade so it is not rotated; generate one on first install.
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}

{{- if eq .Values.storage.mode "seaweedfs" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-seaweedfs" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.storage.seaweedfs.storage.class }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.seaweedfs.storage.size | quote }}
{{- end }}

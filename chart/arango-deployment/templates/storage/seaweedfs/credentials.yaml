{{- if eq .Values.storage.mode "seaweedfs" }}
{{- $configName := printf "%s-seaweedfs-config" .Release.Name }}
{{- $credName := printf "%s-seaweedfs-credentials" .Release.Name }}
{{- $access := .Values.storage.seaweedfs.accessKey | default "seaweedfsadmin" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $credName }}
{{- $secret := .Values.storage.seaweedfs.secretKey }}
{{- if not $secret }}{{ if $existing }}{{ $secret = index $existing.data "secretKey" | b64dec }}{{ else }}{{ $secret = randAlphaNum 32 }}{{ end }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $configName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: seaweedfs
type: Opaque
stringData:
  # SeaweedFS S3 identities, consumed by the server via `-s3.config`.
  s3.json: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": {{ $access | quote }},
              "secretKey": {{ $secret | quote }}
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: seaweedfs
type: Opaque
data:
  # S3 credentials the ArangoPlatformStorage uses to reach the in-cluster SeaweedFS.
  accessKey: {{ $access | b64enc | quote }}
  secretKey: {{ $secret | b64enc | quote }}
{{- end }}

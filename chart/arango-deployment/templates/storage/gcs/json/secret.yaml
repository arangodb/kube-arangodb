{{- if and (eq .Values.storage.mode "gcs") (eq .Values.storage.gcs.credentials "json") }}
{{- $sa := required "storage.gcs.serviceAccount (inline ServiceAccount JSON) is required when storage.gcs.credentials is \"json\"" .Values.storage.gcs.serviceAccount }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-gcs-credentials" .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # GCS ServiceAccount JSON key (consumed by the storage integration).
  serviceAccount: {{ $sa | quote }}
{{- end }}

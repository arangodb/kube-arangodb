{{- if and (eq .Values.storage.mode "gcs") (eq .Values.storage.gcs.credentials "secret") }}
{{- $gcs := .Values.storage.gcs }}
apiVersion: platform.arangodb.com/v1beta1
kind: ArangoPlatformStorage
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backend:
    gcs:
      projectID: {{ $gcs.projectID | quote }}
      bucketName: {{ .Values.storage.bucketName | quote }}
      {{- with .Values.storage.bucketPath }}
      bucketPath: {{ . | quote }}
      {{- end }}
      credentialsSecret:
        name: {{ required "storage.gcs.credentialsSecret is required when storage.gcs.credentials is \"secret\"" $gcs.credentialsSecret | quote }}
{{- end }}

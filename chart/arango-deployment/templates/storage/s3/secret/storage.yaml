{{- if eq .Values.storage.mode "s3" }}
{{- $s3 := .Values.storage.s3 }}
{{- $secretName := $s3.credentialsSecret | default (printf "%s-s3-credentials" .Release.Name) }}
apiVersion: platform.arangodb.com/v1beta1
kind: ArangoPlatformStorage
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backend:
    s3:
      endpoint: {{ $s3.endpoint | quote }}
      bucketName: {{ .Values.storage.bucketName | quote }}
      {{- with .Values.storage.bucketPath }}
      bucketPath: {{ . | quote }}
      {{- end }}
      {{- with $s3.region }}
      region: {{ . | quote }}
      {{- end }}
      allowInsecure: {{ $s3.allowInsecure }}
      credentialsSecret:
        name: {{ $secretName | quote }}
{{- end }}

{{- if and (eq .Values.storage.mode "s3") (not .Values.storage.s3.credentialsSecret) }}
{{- $name := printf "%s-s3-credentials" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  accessKey: {{ if $existing }}{{ index $existing.data "accessKey" }}{{ else }}{{ .Values.storage.s3.accessKey | b64enc }}{{ end }}
  secretKey: {{ if $existing }}{{ index $existing.data "secretKey" }}{{ else }}{{ .Values.storage.s3.secretKey | b64enc }}{{ end }}
{{- end }}

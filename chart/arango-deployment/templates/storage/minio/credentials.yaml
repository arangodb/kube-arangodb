{{- if eq .Values.storage.mode "minio" }}
{{- $rootName := printf "%s-minio-root" .Release.Name }}
{{- $credName := printf "%s-minio-credentials" .Release.Name }}
{{- $user := .Values.storage.minio.rootUser | default "minioadmin" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $rootName }}
{{- $password := .Values.storage.minio.rootPassword }}
{{- if not $password }}{{ if $existing }}{{ $password = index $existing.data "MINIO_ROOT_PASSWORD" | b64dec }}{{ else }}{{ $password = randAlphaNum 32 }}{{ end }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rootName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: minio
type: Opaque
data:
  # Root credentials consumed by the MinIO server via envFrom. Provide storage.minio.rootUser /
  # storage.minio.rootPassword (e.g. at `helm install`) to set them; otherwise the password is
  # generated on first install and reused on upgrade.
  MINIO_ROOT_USER: {{ $user | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ $password | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: minio
type: Opaque
data:
  # S3 credentials the ArangoPlatformStorage uses to reach the in-cluster MinIO.
  accessKey: {{ $user | b64enc | quote }}
  secretKey: {{ $password | b64enc | quote }}
{{- end }}

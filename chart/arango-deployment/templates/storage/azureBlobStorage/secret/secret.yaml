{{- if and (eq .Values.storage.mode "azureBlobStorage") (not .Values.storage.azureBlobStorage.credentialsSecret) }}
{{- $name := printf "%s-azure-credentials" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
data:
  clientId: {{ if $existing }}{{ index $existing.data "clientId" }}{{ else }}{{ .Values.storage.azureBlobStorage.clientId | b64enc }}{{ end }}
  clientSecret: {{ if $existing }}{{ index $existing.data "clientSecret" }}{{ else }}{{ .Values.storage.azureBlobStorage.clientSecret | b64enc }}{{ end }}
{{- end }}

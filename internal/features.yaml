features:
  - name: Pod Disruption Budgets
    enabled: true
    releases:
      - operatorVersion: 0.3.10
        state: Alpha
      - operatorVersion: 0.3.11
        state: Production
  - name: Volume Resizing
    enabled: true
    releases:
      - operatorVersion: 0.3.10
        state: Alpha
      - operatorVersion: 0.3.11
        state: Production
  - name: Disabling of liveness probes
    enabled: true
    releases:
      - operatorVersion: 0.3.10
        state: Alpha
      - operatorVersion: 0.3.11
        state: Production
  - name: Volume Claim Templates
    enabled: true
    releases:
      - operatorVersion: 0.3.10
        state: Alpha
      - operatorVersion: 0.3.11
        state: Production
  - name: Prometheus Metrics Exporter
    enabled: true
    remarks: Prometheus required
    releases:
      - operatorVersion: 0.3.10
        state: Alpha
      - operatorVersion: 0.3.11
        state: Production
  - name: Sidecar Containers
    enabled: true
    releases:
      - operatorVersion: 0.3.10
        state: Alpha
      - operatorVersion: 0.3.11
        state: Production
  - name: Operator Single Mode
    enabled: False
    flag: --mode.single
    remarks: Only 1 instance of Operator allowed in namespace when feature is enabled
    releases:
      - operatorVersion: 1.0.4
        state: Production
  - name: TLS SNI Support
    arangoDBEditions: Enterprise
    enabled: true
    flag: --deployment.feature.tls-sni
    releases:
      - operatorVersion: 1.0.3
        state: Production
  - name: TLS Runtime Rotation Support
    arangoDBEditions: Enterprise
    enabled: true
    flag: --deployment.feature.tls-rotation
    releases:
      - operatorVersion: 1.0.4
        state: Alpha
      - operatorVersion: 1.1.0
        state: Production
  - name: JWT Rotation Support
    arangoDBEditions: Enterprise
    enabled: true
    flag: --deployment.feature.jwt-rotation
    releases:
      - operatorVersion: 1.0.3
        state: Alpha
      - operatorVersion: 1.1.0
        state: Production
  - name: Encryption Key Rotation Support
    arangoDBEditions: Enterprise
    flag: --deployment.feature.encryption-rotation
    enabled: false
    releases:
      - operatorVersion: 1.0.3
        state: Alpha
      - operatorVersion: 1.2.0
        state: NotSupported
  - name: Version Check
    flag: --deployment.feature.upgrade-version-check
    enabled: true
    releases:
      - operatorVersion: 1.1.4
        state: Alpha
      - operatorVersion: 1.2.23
        state: Production
  - name: Version Check V2
    flag: --deployment.feature.upgrade-version-check-v2
    enabled: false
    remarks: Enable initContainer with pre version check based by Operator
    releases:
      - operatorVersion: 1.2.31
        state: Alpha
  - name: Operator Maintenance Management Support
    flag: --deployment.feature.maintenance
    enabled: true
    releases:
      - operatorVersion: 1.0.7
        state: Alpha
      - operatorVersion: 1.2.0
        state: Production
  - name: Graceful Restart
    flag: '---deployment.feature.graceful-shutdown'
    enabled: true
    releases:
      - operatorVersion: 1.0.7
        state: Alpha
      - operatorVersion: 1.2.5
        state: Production
  - name: Optional Graceful Restart
    flag: --deployment.feature.optional-graceful-shutdown
    enabled: false
    releases:
      - operatorVersion: 1.2.5
        state: Beta
      - operatorVersion: 1.2.0
        state: Production
  - name: Operator Internal Metrics Exporter
    flag: --deployment.feature.metrics-exporter
    enabled: true
    releases:
      - operatorVersion: 1.2.0
        state: Production
  - name: Operator Ephemeral Volumes
    doc: docs/features/ephemeral_volumes.md
    flag: --deployment.feature.ephemeral-volumes
    enabled: false
    releases:
      - operatorVersion: 1.2.2
        state: Alpha
      - operatorVersion: 1.2.31
        state: Beta
  - name: Failover Leader service
    doc: docs/features/failover_leader_service.md
    flag: --deployment.feature.failover-leadership
    enabled: false
    arangoDBVersion: "< 3.12.0"
    releases:
      - operatorVersion: 1.2.13
        state: Production
  - name: ActiveFailover Support
    flag: --deployment.feature.active-failover
    enabled: true
    arangoDBVersion: "< 3.12.0"
    releases:
      - operatorVersion: 1.0.0
        state: Production
  - name: Spec Default Restore
    doc: docs/features/deployment_spec_defaults.md
    flag: --deployment.feature.deployment-spec-defaults-restore
    enabled: true
    remarks: If set to False Operator will not change ArangoDeployment Spec
    releases:
      - operatorVersion: 1.2.21
        state: Alpha
      - operatorVersion: 1.2.25
        state: Beta
  - name: Force Rebuild Out Synced Shards
    doc: docs/features/rebuild_out_synced_shards.md
    flag: --deployment.feature.force-rebuild-out-synced-shards
    enabled: false
    remarks: It should be used only if user is aware of the risks.
    releases:
      - operatorVersion: 1.2.27
        state: Production
  - name: Rebalancer
    doc: docs/features/rebalancer.md
    enabled: true
    operatorEditions: Enterprise
    arangoDBEditions: Enterprise
    releases:
      - operatorVersion: 1.2.5
        state: Alpha
      - operatorVersion: 1.2.15
        state: Production
  - name: Rebalancer V2
    doc: docs/features/rebalancer_v2.md
    arangoDBVersion: ">= 3.10.0"
    flag: --deployment.feature.rebalancer-v2
    enabled: false
    releases:
      - operatorVersion: 1.2.31
        state: Alpha
  - name: Secured containers
    doc: docs/features/secured_containers.md
    flag: --deployment.feature.secured-containers
    enabled: false
    remarks: If set to True Operator will run containers in secure mode
    releases:
      - operatorVersion: 1.2.31
        state: Alpha
  - name: TopologyAwareness
    doc: docs/design/topology_awareness.md
    enabled: true
    operatorEditions: Enterprise
    arangoDBEditions: Enterprise
    releases:
      - operatorVersion: 1.2.4
        state: Production
  - name: AgencyCache
    enabled: true
    operatorEditions: Enterprise
    arangoDBEditions: Enterprise
    remarks: Enable Agency Cache mechanism in the Operator (Increase limit of the nodes)
    releases:
      - operatorVersion: 1.2.30
        state: Production
  - name: Member Maintenance Support
    enabled: true
    operatorEditions: Enterprise
    arangoDBEditions: Enterprise
    remarks: Enable Member Maintenance during planned restarts
    releases:
      - operatorVersion: 1.2.16
        state: Alpha
      - operatorVersion: 1.2.25
        state: Production
  - name: Copy resources spec to init containers
    enabled: true
    remarks: Copy resources spec to built-in init containers if they are not specified
    flag: --deployment.feature.init-containers-copy-resources
    releases:
      - operatorVersion: 1.2.33
        state: Production
  - name: Upscale resources spec in init containers
    enabled: true
    remarks: Upscale resources spec to built-in init containers if they are not specified or lower
    flag: --deployment.feature.init-containers-upscale-resources
    releases:
      - operatorVersion: 1.2.36
        state: Production
  - name: Enforced ResignLeadership
    enabled: true
    remarks: Enforce ResignLeadership and ensure that Leaders are moved from restarted DBServer
    flag: --deployment.feature.enforced-resign-leadership
    releases:
      - operatorVersion: 1.2.34
        state: Production
  - name: Create backups asynchronously
    enabled: true
    remarks: Create backups asynchronously to avoid blocking the operator and reaching the timeout
    flag: --deployment.feature.async-backup-creation
    releases:
      - operatorVersion: 1.2.41
        state: Production
      - operatorVersion: 1.2.35
        state: Production
  - name: Cleanup Imported Backups
    enabled: false
    remarks: Cleanup backups created outside of the Operator and imported into Kubernetes ArangoBackup
    flag: --deployment.feature.backup-cleanup
    releases:
      - operatorVersion: 1.2.41
        state: Production
  - name: ArangoPlatform
    remarks: ArangoPlatform Solution with support for ArangoDeployment Gateway Group
    releases:
      - operatorVersion: 1.2.43
        state: Alpha
      - operatorVersion: 1.2.49
        state: Beta
  - name: ArangoPlatform OpenID SSO
    remarks: Support for ArangoPlatform SSO with OpenID
    releases:
      - operatorVersion: 1.2.49
        state: Beta
  - name: ArangoPlatform OpenID SSO Refresh
    remarks: Support for ArangoPlatform SSO with OpenID Refresh
    releases:
      - operatorVersion: 1.2.49
        state: Alpha
  - name: Harden ArangoDB Server Containers
    flag: --deployment.feature.harden
    enabled: false
    remarks: Adds hardening arguments to the ArangoDB server containers
    releases:
      - operatorVersion: 1.4.4
        state: Alpha
  - name: Agency Poll
    flag: --deployment.feature.agency-poll
    enabled: true
    remarks: Enable Agency Poll for Enterprise deployments
    releases:
      - operatorVersion: 1.2.30
        state: Production
  - name: Backup Policy Until Propagation
    flag: --deployment.feature.backup-policy-until-propagation
    enabled: true
    remarks: Sets Until field in the Backup based on next schedule time
    releases:
      - operatorVersion: 1.4.4
        state: Alpha
  - name: Central Services
    arangoDBEditions: Enterprise
    flag: --deployment.feature.central-services
    enabled: false
    remarks: Enables Central Services
    releases:
      - operatorVersion: 1.4.4
        state: Alpha
  - name: Gateway
    flag: --deployment.feature.gateway
    enabled: true
    remarks: Defines if gateway extension is enabled
    releases:
      - operatorVersion: 1.2.43
        state: Production
  - name: Gateway Sidecar
    arangoDBEditions: Enterprise
    flag: --deployment.feature.gateway-sidecar
    enabled: false
    remarks: Enables Gateway Integration
    releases:
      - operatorVersion: 1.4.2
        state: Production
  - name: JWT Asymmetric Key
    flag: --deployment.feature.jwt-asymmetric-key
    enabled: false
    remarks: Uses Asymmetric Key as a default in ArangoDB
    releases:
      - operatorVersion: 1.4.4
        state: Alpha
  - name: Local Volume Replacement Check
    flag: --deployment.feature.local-volume-replacement-check
    enabled: false
    remarks: Replace volume for local-storage if volume is unschedulable (ex. node is gone)
    releases:
      - operatorVersion: 1.2.28
        state: Production
  - name: Random Pod Names
    flag: --deployment.feature.random-pod-names
    enabled: false
    remarks: Enables generating random pod names
    releases:
      - operatorVersion: 1.4.4
        state: Alpha
  - name: Replace Migration
    flag: --deployment.feature.replace-migration
    enabled: true
    remarks: During member replacement shards are migrated directly to the new server
    releases:
      - operatorVersion: 1.4.4
        state: Alpha
  - name: Restart Policy Always
    flag: --deployment.feature.restart-policy-always
    enabled: false
    remarks: Allow to restart containers with always restart policy
    releases:
      - operatorVersion: 1.2.14
        state: Production
  - name: Sensitive Information Protection
    flag: --deployment.feature.sensitive-information-protection
    enabled: false
    remarks: Hide sensitive information from metrics and logs
    releases:
      - operatorVersion: 1.4.4
        state: Alpha
  - name: Short Pod Names
    flag: --deployment.feature.short-pod-names
    enabled: false
    remarks: Enable Short Pod Names
    releases:
      - operatorVersion: 1.2.4
        state: Production
  - name: Timezone Management
    flag: --deployment.feature.timezone-management
    enabled: false
    remarks: Enable timezone management for pods
    releases:
      - operatorVersion: 1.2.16
        state: Production
  - name: ArangoDeployment Status Subresource
    enabled: false
    flag: --deployment.feature.enable-arango-deployment-status
    remarks: Ensures the status subresource on the ArangoDeployment v1 CRD when enabled; when disabled the operator leaves it as the chart ships it (neither adds nor removes it)
    releases:
      - operatorVersion: 1.5.0
        state: Production
